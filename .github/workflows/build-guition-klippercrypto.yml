name: Build Guition KlipperCryptoWeatherPanel
run-name: ${{ inputs.correlation_id != '' && format('build-{0}', inputs.correlation_id) || 'Build Guition KlipperCryptoWeatherPanel' }}

on:
  workflow_dispatch:
    inputs:
      config_h_b64:
        description: "Base64-kodierter Inhalt von config_private.h. Leer = CONFIG_PRIVATE_H-Secret oder Example-Fallback."
        required: false
        type: string
        default: ""
      correlation_id:
        description: "Optionale ID, ueber die externe Systeme den Run wiederfinden (run-name wird auf build-<id> gesetzt)."
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  SKETCH_DIR: Guition_JC4827W543/KlipperCryptoWeatherPanel
  BUILD_DIR: firmware-guition-klippercrypto
  # ESP32S3 Dev Module, passend zu den Arduino-IDE-Einstellungen im Projekt-README.
  FQBN: esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,FlashSize=4M,FlashMode=qio,PartitionScheme=huge_app,PSRAM=opi

jobs:
  build:
    name: Build Arduino firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Arduino CLI
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/.local/bin" sh -s 1.4.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/arduino-cli" version

      - name: Install ESP32 core
        shell: bash
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.8

      - name: Install pinned libraries
        shell: bash
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "lvgl@9.5.0"
          arduino-cli lib install "LovyanGFX@1.2.21"
          arduino-cli lib install "ArduinoJson@7.4.3"

      - name: Prepare private config
        shell: bash
        env:
          CONFIG_PRIVATE_H: ${{ secrets.CONFIG_PRIVATE_H }}
          INPUT_CONFIG_H_B64: ${{ inputs.config_h_b64 }}
        run: |
          # Vorrang: Dispatch-Input (base64) > Repo-Secret > Example-Fallback.
          # Das ::add-mask:: verhindert, dass dekodierte Werte in Logs auftauchen,
          # falls die Build-Tools sie ausgeben.
          if [ -n "${INPUT_CONFIG_H_B64}" ]; then
            echo "::add-mask::${INPUT_CONFIG_H_B64}"
            echo "${INPUT_CONFIG_H_B64}" | base64 -d > "${SKETCH_DIR}/config_private.h"
            echo "::notice::Using config_private.h from workflow_dispatch input."
          elif [ -n "${CONFIG_PRIVATE_H}" ]; then
            printf '%s\n' "${CONFIG_PRIVATE_H}" > "${SKETCH_DIR}/config_private.h"
            echo "::notice::Using config_private.h from CONFIG_PRIVATE_H secret."
          else
            echo "::notice::No config provided. Building with config_private.example.h dummy values."
            cp "${SKETCH_DIR}/config_private.example.h" "${SKETCH_DIR}/config_private.h"
          fi

      - name: Compile firmware
        shell: bash
        run: |
          mkdir -p "${BUILD_DIR}"
          arduino-cli compile \
            --fqbn "${FQBN}" \
            --export-binaries \
            --output-dir "${BUILD_DIR}" \
            "${SKETCH_DIR}"

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v6
        with:
          name: guition-klippercrypto-bin
          path: ${{ env.BUILD_DIR }}/*.bin
          if-no-files-found: error

  release:
    name: Publish temporary build release
    needs: build
    if: inputs.correlation_id != ''
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download firmware artifact
        uses: actions/download-artifact@v7
        with:
          name: guition-klippercrypto-bin
          path: firmware

      - name: Pick merged binary
        id: pick
        shell: bash
        run: |
          MERGED=$(find firmware -maxdepth 2 -name "*.merged.bin" -print -quit)
          if [ -z "${MERGED}" ]; then
            echo "::error::No merged.bin found in firmware artifact"
            exit 1
          fi
          cp "${MERGED}" firmware/firmware.bin
          ls -lh firmware/

      - name: Create temporary release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
        run: |
          TAG="build-${CORRELATION_ID}"
          # Idempotent: falls der Tag bereits existiert (Re-Run), erst loeschen.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release delete "${TAG}" --cleanup-tag --yes
          fi
          gh release create "${TAG}" \
            --prerelease \
            --title "${TAG}" \
            --notes "On-demand build, correlation_id=${CORRELATION_ID}. Wird vom Cleanup-Workflow nach 24h geloescht." \
            --target "${GITHUB_SHA}" \
            "firmware/firmware.bin"
