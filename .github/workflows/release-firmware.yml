name: Crypto Panel 8048S043C Firmware Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Type 'yes' to publish a GitHub release tagged from version.h. Anything else just uploads build artifacts."
        required: false
        default: "no"
        type: string

permissions:
  contents: write

env:
  PROJECT_DIR: ESP32-8048S043C/esp-idf-test/KlipperCryptoWeatherPanel_port
  PROJECT_NAME: KlipperCryptoWeatherPanel_port
  RELEASE_NAME: Klipper Crypto Weather Panel V2
  BOARD_NAME: ESP32-8048S043C
  FIRMWARE_BASENAME: KCWPv2_8048S043C
  IDF_TARGET: esp32s3
  VERSION_HEADER: ESP32-8048S043C/esp-idf-test/KlipperCryptoWeatherPanel_port/main/version.h

jobs:
  build:
    name: Build ${{ matrix.language }} firmware
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1
    strategy:
      fail-fast: false
      matrix:
        language: [de, en]

    defaults:
      run:
        shell: bash
        working-directory: ESP32-8048S043C/esp-idf-test/KlipperCryptoWeatherPanel_port

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build firmware
        run: |
          . /opt/esp/idf/export.sh

          cp sdkconfig.defaults "sdkconfig.ci.${{ matrix.language }}"
          if [ "${{ matrix.language }}" = "en" ]; then
            {
              echo "# CONFIG_APP_LANG_DE is not set"
              echo "CONFIG_APP_LANG_EN=y"
            } >> "sdkconfig.ci.${{ matrix.language }}"
          else
            {
              echo "CONFIG_APP_LANG_DE=y"
              echo "# CONFIG_APP_LANG_EN is not set"
            } >> "sdkconfig.ci.${{ matrix.language }}"
          fi

          idf.py \
            -B "build-${{ matrix.language }}" \
            -DSDKCONFIG="sdkconfig.ci.${{ matrix.language }}" \
            build

      - name: Collect binaries
        run: |
          . /opt/esp/idf/export.sh

          mkdir -p "release-${{ matrix.language }}"

          cp \
            "build-${{ matrix.language }}/${PROJECT_NAME}.bin" \
            "release-${{ matrix.language }}/${FIRMWARE_BASENAME}-${{ matrix.language }}-ota.bin"

          (
            cd "build-${{ matrix.language }}"
            esptool.py --chip "${IDF_TARGET}" merge_bin \
              -o "../release-${{ matrix.language }}/${FIRMWARE_BASENAME}-${{ matrix.language }}-full.bin" \
              @flash_args
          )

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware-${{ matrix.language }}
          path: ${{ env.PROJECT_DIR }}/release-${{ matrix.language }}/*.bin
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.release == 'yes'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read firmware version from version.h
        id: version
        run: |
          FW_VERSION=$(sed -n 's/^#define APP_FW_VERSION "\(.*\)".*/\1/p' "${VERSION_HEADER}" | head -n 1)
          if [ -z "${FW_VERSION}" ]; then
            echo "Could not read APP_FW_VERSION from ${VERSION_HEADER}" >&2
            exit 1
          fi
          echo "Detected APP_FW_VERSION='${FW_VERSION}'"
          echo "fw_version=${FW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download firmware artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: firmware-*
          path: release-bins
          merge-multiple: true

      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FW_VERSION: ${{ steps.version.outputs.fw_version }}
        run: |
          RELEASE_TAG="v${FW_VERSION}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${RELEASE_TAG} already exists. Bump APP_FW_VERSION in main/version.h before publishing again."
            exit 1
          fi

          if git -C "$GITHUB_WORKSPACE" rev-parse "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Git tag ${RELEASE_TAG} already exists. Bump APP_FW_VERSION in main/version.h before publishing again."
            exit 1
          fi

          gh release create "${RELEASE_TAG}" \
            release-bins/*.bin \
            --title "${RELEASE_TAG}" \
            --notes "${RELEASE_NAME} ESP-IDF firmware binaries for ${BOARD_NAME}, German (de) and English (en)." \
            --target "${GITHUB_SHA}"
