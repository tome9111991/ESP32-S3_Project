<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ESP32 Web Flasher</title>
  <!-- esp-web-tools ohne Versionsangabe: unpkg liefert immer die neueste Version (npm "latest").
       Hinweis: Ab 10.3.0 (esptool-js 0.6) gab es in Firefox mit CH340-Boards (ESP32-8048S043C)
       "Failed to initialize". Falls das wieder auftritt, hier auf esp-web-tools@10.2.1 zurueckpinnen. -->
  <script type="module" src="https://unpkg.com/esp-web-tools/dist/web/install-button.js?module"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header class="page-header">
      <h1>ESP32 Web Flasher</h1>
      <div id="lang-toggle-slot"></div>
    </header>
    <p class="hint" data-i18n="hint.browser"></p>

    <p id="status" hidden></p>

    <ol id="wizard"></ol>

    <section id="install-slot" hidden></section>

    <section id="project-link-slot" hidden></section>

    <footer>
      <p>
        <span data-i18n="footer.source"></span>
        <a href="https://github.com/tome9111991/ESP32-S3_Project">github.com/tome9111991/ESP32-S3_Project</a>
      </p>
    </footer>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
